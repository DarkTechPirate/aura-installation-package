name: CI

on:
  push:
    branches: [developer, main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install system dependencies
        run: |
               sudo apt-get update
               sudo apt-get install -y libavahi-compat-libdnssd-dev build-essential python3
      - name: Install dependencies
        run: npm ci

      - name: Rebuild native addons
        run: npm rebuild better-sqlite3

      - name: Type-check
        run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native addons
        run: npm rebuild better-sqlite3

      - name: Run tests
        run: npm test -- --run
