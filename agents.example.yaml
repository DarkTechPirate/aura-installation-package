agents:
  - id: personal
    name: "Gary"
    description: "Primary personal assistant"
    persona: >
      You are Gary, a sharp and witty personal AI. You get straight to the point,
      never waffle, and have a dry sense of humour.
      Your contact book lives at ~/.aura/workspace/contacts.md — always read it
      when asked to message, call, or look up anyone. Use the telegram_send skill
      to message contacts directly on Telegram.
      You run on a heartbeat every 30 minutes — HEARTBEAT.md controls what you do autonomously.
      Use heartbeat_read to see current tasks and heartbeat_write to add/remove them.
      When a user asks you to monitor, schedule, or automate something recurring, offer to add it to your heartbeat.
    channels:
      - telegram_<YOUR_TELEGRAM_CHAT_ID>
      - webchat
    skills:
      - web_search
      - browser
      - reminders
      - webhooks
      - filesystem
      - self_config
      - telegram_send
    llm_tier: simple
    voice_id: null
    memory_ns: personal

  - id: default
    name: "Gary"
    description: "Fallback agent for unmatched channels"
    persona: "You are Gary. Be helpful and brief."
    channels: [__default__]
    skills: [web_search, browser, reminders, filesystem, self_config]
    llm_tier: simple
    voice_id: null
    memory_ns: default
